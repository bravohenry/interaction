[project]
name = "openpoke-server"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "python-dateutil>=2.9.0",
    "beautifulsoup4>=4.12.0",
    "composio>=0.5.0",
    "sqlalchemy>=2.0.0",
    "nanoid>=2.0.0",
    "upstash-redis>=1.4.0",
    "upstash-ratelimit>=1.1.0",
    "aiomysql>=0.2.0",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "ruff>=0.14.0",
    "types-python-dateutil>=2.9.0",
    "types-nanoid>=2.0.0",
]


[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true